name: CI
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly: catches the docs changing under the examples
jobs:
  express:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: express } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: express/package-lock.json }
      - run: npm ci
      - run: node --check server.js
  fastapi:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: fastapi } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: SCREENLYYID_API_KEY=test_ci_placeholder python -c "import main; print([r.path for r in main.app.routes if r.path.startswith('/api')])"
  nextjs:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: nextjs } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: nextjs/package-lock.json }
      - run: npm ci
      - run: npx next build
  docs-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_docs_in_sync.py
